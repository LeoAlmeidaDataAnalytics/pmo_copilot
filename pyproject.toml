[buie prld-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmo-copilot"
version = "0.1.0"
description = "Assistente de IA para PMOs: auditoria, controle financeiro (CAPEX/EVM) e relatórios de portfólio de projetos de mineração."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[google-genai]",
    "python-dotenv",
    "streamlit",
    "plotly",
    "pandas",
    "numpy",
    # Mac Intel (x86_64): versões >=49 não têm wheel pronto
    "cryptography<49",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
pmo-gerar-dados = "pmo_copilot.data.generator:main"
pmo-relatorio = "pmo_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
